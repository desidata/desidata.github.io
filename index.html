<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore India through DesiData’s maps and follow the stories on Instagram.">
  <title>DesiData | India through maps</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="maps.js"></script>
</head>
<body>
  <header>
    <a class="logo" href="./"><img src="LOGO.jpg" alt="">Desi<span>Data</span></a>
    <nav aria-label="Main"><a href="#collection">Map gallery</a><a class="follow" href="https://www.instagram.com/desidata.info/">Follow on Instagram</a></nav>
  </header>
  <main>
    <section class="spotlight" aria-label="Explore a map">
      <div class="story">
        <div class="story-label">India through maps</div>
        <div><h1 id="question"></h1><p id="teaser"></p></div>
        <a id="story-link" target="_blank" rel="noopener noreferrer">Explore on Instagram ↗</a>
      </div>
      <div class="artboard"><a id="art-link" target="_blank" rel="noopener noreferrer"><img id="art" alt=""></a>
        <div class="slide-controls" hidden>
          <button type="button" data-step="-1" aria-label="Previous map">‹</button>
          <output aria-live="off"></output>
          <button type="button" data-step="1" aria-label="Next map">›</button>
          <button type="button" class="pause" aria-label="Toggle automatic slides">Pause</button>
        </div></div>
      <div class="topics" aria-label="Choose a map story"></div>
    </section>
    <section id="collection" aria-labelledby="gallery-title">
      <h2 id="gallery-title">Map gallery</h2>
      <div id="gallery"></div>
    </section>
  </main>
  <footer><strong>Follow the next map.</strong><a href="https://www.instagram.com/desidata.info/">@desidata.info</a></footer>
  <template id="card">
    <a class="card" target="_blank" rel="noopener noreferrer">
      <div class="sheet"><img loading="lazy"></div>
      <div class="caption"><h2></h2><span aria-hidden="true"></span></div>
    </a>
  </template>
</body>
</html>
