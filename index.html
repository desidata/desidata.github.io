<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore India through DesiData’s maps and follow the stories on Instagram.">
  <title>DesiData | India through maps</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="maps.js"></script>
</head>
<body>
  <header>
    <a class="logo" href="./">Desi<span>Data</span></a>
    <nav aria-label="Main"><a href="#collection">Map gallery</a><a class="follow" href="https://www.instagram.com/desidata.info/">Follow on Instagram</a></nav>
  </header>
  <main>
    <section id="collection" aria-labelledby="gallery-title">
      <h1 id="gallery-title">India through <em>maps</em></h1>
      <div id="gallery"></div>
    </section>
  </main>
  <footer><strong>Follow the next map.</strong><a href="https://www.instagram.com/desidata.info/">@desidata.info</a></footer>
  <template id="card">
    <a class="card" target="_blank" rel="noopener noreferrer">
      <div class="sheet"><img loading="lazy"></div>
      <div class="caption"><div><h2></h2><p class="question"></p></div><span aria-hidden="true"></span></div>
    </a>
  </template>
</body>
</html>
